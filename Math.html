<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math</title>
</head>
<body>
    <script>

        /*
            Math
        => Math merupakan class di JavaScript yang berisikan Static Property dan Method untuk 
            Operasi Matematika
        => Ada banyak sekali Static Property dan Method di Math
        => Math hanya bisa digunakan untuk Type data Number, Tidak bisa digunakan untuk type 
            Data BigInt
        */ 

        // Contoh sedikit
        console.log(Math.min(9,9,12,3,12,15,10)) // Mencari angka terbesar
        console.log(Math.max(1,9,12,3,12,15,10)) // Mencari Angka terkecil
        console.log(Math.round(10.5)) // Membulatkan ke paling terdekat result 11
        console.log(Math.round(10.3)) // Membulatkan ke paling terdekat result 10
        console.log(Math.floor(10.9)) // Membulatkan ke bawah result 10


    </script>
</body>
</html>
