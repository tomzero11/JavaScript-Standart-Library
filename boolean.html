<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean</title>
</head>
<body>
    <script>

        /*
            Boolean
        => Boolean merupakan Wrapper calss untuk type data Primitif boolean
        => Boolean memiliki Method toString() untuk mengkonversi ke String
        => dan Memiliki method valueOf() digunakan untuk mengkonversi ke type boolean primitif
        */ 

        const boolean = Boolean(true)
        console.log(boolean)
        console.log(typeof boolean)
        console.log(boolean.toString())
        console.log(boolean.valueOf())

    </script>
</body>
</html>
