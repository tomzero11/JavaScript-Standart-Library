<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
</head>
<body>
    <script>

        /*
            Map
        => Map merupakan representasi dari stuktur data Key-Value
        => Map mirip dengan type data Object, hanya saja pada Map, semua method untuk
            memanipulasi data sudah Di sediakan
        => Map mengikuti Kontrak Iterablem sehingga bisa di iterasi secara default
        */ 

        /*
            Map Instance Method 
            Method & Property                   Keterangan
        => Size                   :       mengetahui panjang Set
        => clear                  :       Menghapus semua isi value di map
        => delete(key)            :       Menghapus data Map berdasarkan Key
        => get(key) return value  :       Mendapatkan data Map berdasarkan Key 
        => has(key) return boolean :      Mengecek apakah Map berisi data Key
        => set(key,value)          :      merubah data Map (Data Lama = Data baru) jika tidak ada maka otomatis di tambahkan menjadi data Baru 
        => forEach(value =>)      :       Melakukan iterasi Map
        */ 

        /*
            Map Ada Istilah Entries 
        => Entries adalah Pasangan antara Key dan Value di Map
        */
        const map = new Map()
        map.set("Name", "Mamad Kusnandar")
        map.set("Address", "Surabaya")
        map.set("County", "Indonesia")


        console.log(map)
        console.log(map.get("Name"))
        console.log(map.get("Address"))
        map.forEach((value, key) => {
            console.log(`${key} : ${value}`)
        });

        const dataArray = ["Mamad","Juned", "Kusnandar"]
        dataArray.forEach(( value, index) => {
            console.log(`${value} : ${index}`)
        })

    </script>
</body>
</html>
